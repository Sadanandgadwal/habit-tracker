<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
  <title>Habit Tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Habit Tracker</h1>
      <p id="today" class="today"></p>
    </header>

    <p id="storage-message" class="storage-message" role="alert" hidden></p>

    <form id="add-form" class="add-form" novalidate>
      <label for="habit-name" class="visually-hidden">New habit name</label>
      <input id="habit-name" type="text" maxlength="80" placeholder="Add a habit, e.g. Read" autocomplete="off" aria-describedby="form-error">
      <button type="submit" class="add-button">Add</button>
    </form>
    <p id="form-error" class="form-error" role="status"></p>

    <ul id="habit-list" class="habit-list"></ul>
    <p id="empty-state" class="empty-state" hidden>No habits yet. Add your first one above.</p>
  </main>

  <template id="habit-template">
    <li class="habit">
      <div class="tick">
        <input type="checkbox" data-action="toggle">
        <span class="tick-box" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div class="habit-info">
        <span class="habit-name"></span>
        <span class="habit-streak">
          <svg class="flame" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2c.5 3.5-1.2 5.3-2.8 7.1C7.7 10.8 6 12.7 6 15.5 6 19.1 8.7 22 12 22s6-2.9 6-6.5c0-2.5-1.1-4.4-2.3-5.9-.3 1.4-1 2.3-2 2.8.4-3.6-.1-7.6-1.7-10.4z" fill="currentColor"/></svg>
          <span class="streak-text"></span>
        </span>
      </div>
      <ul class="dots"></ul>
      <div class="habit-actions">
        <button type="button" class="icon-button" data-action="rename">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-button icon-button-danger" data-action="delete">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </li>
  </template>
</body>
</html>
